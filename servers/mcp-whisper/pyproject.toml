[project]
name = "mcp-whisper"
version = "0.1.0"
description = "MCP server transcribing audio with faster-whisper, asynchronously via job IDs"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.1.0,<3.0.0",
    "faster-whisper>=1.1.0",
    "httpx>=0.27",
]

[project.scripts]
mcp-whisper = "mcp_whisper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_whisper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
