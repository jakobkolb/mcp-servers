[project]
name = "mcp-whatsapp"
version = "0.1.0"
description = "Read-only WhatsApp MCP server with a chat allowlist and pairing via MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.1.0,<3.0.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.scripts]
mcp-whatsapp = "mcp_whatsapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_whatsapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
