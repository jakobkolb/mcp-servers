[project]
name = "mcp-print"
version = "0.1.0"
description = "Print documents passed inline in the tool call through the host's CUPS server"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.1.0,<3.0.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "markdown>=3.6",
    "pypdf>=5.0",
]

[project.scripts]
mcp-print = "mcp_print:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_print"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
